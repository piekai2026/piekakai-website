[project]
name = "piekai-agents"
version = "0.1.0"
description = "PiekAI autonomous agent workers — Scout, Perception, Diagnostician, Strategist, Operator, Guardian, Analyst, plus the Conductor orchestrator (Phase 1+)"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "httpx>=0.28",
  "asyncpg>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
