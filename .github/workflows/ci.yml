# ci.yml — PiekAI pull-request & branch CI
#
# Triggers on every push to non-main branches and on every pull_request.
# Runs: Biome lint, TypeScript typecheck, web build, Vitest tests.
#
# No GitHub secrets required by this workflow.

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: TypeScript typecheck (all packages)
        run: pnpm -r run typecheck

      - name: Build web app
        run: pnpm --filter web build

      - name: Run tests
        run: pnpm exec vitest run --passWithNoTests
